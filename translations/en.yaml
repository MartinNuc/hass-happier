configuration:
  claude_token:
    name: Claude token
    description: >-
      Optional. A long-lived token from `claude setup-token`, run on any
      computer where Claude Code is logged in. Valid for about a year. Leave
      blank to log in with /login from a Happier terminal instead.
  relay_url:
    name: Happier relay URL
    description: >-
      Leave blank for Happier Cloud. Set it only if you run your own Happier
      relay, and it must be reachable from inside this add-on.
  webapp_url:
    name: Happier web app URL
    description: >-
      Only with a self-hosted relay whose web app lives at a different URL.
      Blank means the same as the relay URL.
