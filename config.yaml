name: "Happier Claude"
version: "0.1.1"
slug: "happier-claude"
description: "Claude Code on your Home Assistant host, driven from the Happier app, with Home Assistant's own MCP server."
url: "https://github.com/MartinNuc/hass-happier"

arch:
  - amd64
  - aarch64

startup: application
boot: auto
init: false

# Setup/status page. The only ingress; nothing is exposed on the LAN.
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-happy-outline
panel_title: Happier

# Gives the add-on SUPERVISOR_TOKEN, which is how Claude reaches
# Home Assistant's MCP server (http://supervisor/core/api/mcp).
homeassistant_api: true

map:
  - homeassistant_config:rw

options:
  relay_url: ""
  webapp_url: ""

schema:
  relay_url: str?
  webapp_url: str?
